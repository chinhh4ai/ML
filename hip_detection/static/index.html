<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIP Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="hip-shell">
  <header class="hip-navbar">
    <div class="brand">
      <span class="brand-badge">HIP</span>
      <span class="brand-title">MVP DEMO v1.0</span>
    </div>

    <nav class="nav-tabs" role="tablist">
      <button class="nav-tab active" id="tab-debris" role="tab" aria-selected="true" onclick="switchPage('debris')">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M3 13.5C5 12 7 12 9 13.5C11 15 13 15 15 13.5C17 12 19 12 21 13.5"></path>
          <path d="M3 17.5C5 16 7 16 9 17.5C11 19 13 19 15 17.5C17 16 19 16 21 17.5"></path>
          <path d="M7 8l5-5 5 5"></path>
          <path d="M12 3v9"></path>
        </svg>
        DEBRIS DETECTION
      </button>
      <button class="nav-tab" id="tab-gauge" role="tab" aria-selected="false" onclick="switchPage('gauge')">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 6v6l4 2"></path>
          <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
        </svg>
        GAUGE DETECTION
      </button>
    </nav>
  </header>

  <main class="hip-content">
    <div class="page-container active" id="page-debris">
      <iframe src="/view/debris" title="Debris Detection"></iframe>
    </div>
    <div class="page-container" id="page-gauge">
      <iframe src="/view/gauge" title="Gauge Detection"></iframe>
    </div>
  </main>

  <script>
    function switchPage(page) {
      document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.remove('active');
        t.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.page-container').forEach(p => p.classList.remove('active'));

      const activeTab = document.getElementById(`tab-${page}`);
      const activePage = document.getElementById(`page-${page}`);
      if (activeTab && activePage) {
        activeTab.classList.add('active');
        activeTab.setAttribute('aria-selected', 'true');
        activePage.classList.add('active');
      }
    }
  </script>
</body>

</html>
